name: Update retail sentiment

on:
  schedule:
    - cron: "35 8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build daily snapshot
        run: python scripts/update_index.py
      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- public/data/latest.json public/data/index.json public/data/daily; then exit 0; fi
          git config user.name "retail-sentiment-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/latest.json public/data/index.json public/data/daily
          git commit -m "data: update daily sentiment snapshot"
          git push
