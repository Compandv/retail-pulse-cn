name: Update retail sentiment

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build daily snapshot
        id: collect
        continue-on-error: true
        run: python scripts/update_index.py
      - name: Commit changed snapshot
        run: |
          if [ -z "$(git status --porcelain -- public/data/latest.json public/data/index.json public/data/daily public/data/archive public/data/market public/data/report)" ]; then exit 0; fi
          git config user.name "retail-sentiment-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/latest.json public/data/index.json public/data/daily public/data/archive public/data/market public/data/report
          git commit -m "data: update daily sentiment snapshot"
          git push
      - name: Report collection failure after preserving successful updates
        if: steps.collect.outcome == 'failure'
        run: exit 1
