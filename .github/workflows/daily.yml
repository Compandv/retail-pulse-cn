name: Update retail sentiment

# Fallback collector. The local scheduled task normally collects at 15:40 Beijing
# time and pushes public/data; this run only collects modules that are still
# older than the latest closed session, so it does nothing on days the PC ran.
on:
  schedule:
    # 12:00 UTC = 20:00 Beijing, Mon-Fri; GitHub often starts scheduled runs later.
    - cron: "0 12 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "忽略数据是否过期，全部模块重新采集"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Shanghai
      PYTHONIOENCODING: utf-8
      # Optional model wording; without these secrets the template text is used.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      OPENAI_API_TYPE: ${{ secrets.OPENAI_API_TYPE }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build stale snapshots
        id: collect
        continue-on-error: true
        # Empty strings are falsy in expressions, so the forced branch passes the default explicitly.
        run: python -u scripts/update_index.py ${{ inputs.force == true && '--only all' || '--if-stale' }}
      - name: Show run summary
        if: always()
        run: cat work/logs/last-run.json || true
      - name: Commit and push public data
        run: |
          git add -- public/data
          if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
          git config user.name "retail-sentiment-bot"
          git config user.email "actions@users.noreply.github.com"
          day=$(python -c "import json; print(json.load(open('work/logs/last-run.json')).get('tradeDate', ''))" 2>/dev/null || true)
          git commit -m "data: daily snapshot ${day} (GitHub)"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main || { git rebase --abort; exit 1; }
          done
          exit 1
      - name: Report collection failure after preserving successful updates
        if: steps.collect.outcome == 'failure'
        run: exit 1
